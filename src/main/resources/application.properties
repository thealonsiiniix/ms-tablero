spring.application.name=ms-tablero
server.port=8083

# H2 en memoria (una base por microservicio)
spring.datasource.url=jdbc:h2:mem:tablero
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Reglas del tablero (RF-03): casilla meta y casillas trampa (origen=destino, el destino debe ser menor)
tablero.meta=30
tablero.trampas.10=5
tablero.trampas.17=7
tablero.trampas.23=12
tablero.trampas.27=14

# JWT: la clave (HS256, minimo 32 caracteres) debe ser la MISMA en los 5 microservicios.
# En uso real, definir la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}
